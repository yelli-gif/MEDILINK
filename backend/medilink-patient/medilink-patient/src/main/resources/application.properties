# ================================================================
# CONFIGURATION SPRING BOOT - LOT 2 : MEDILINK PATIENT
# ================================================================

spring.application.name=medilink-patient

# ================================================================
# CONFIGURATION BASE DE DONNEES POSTGRESQL (Supabase)
# ================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.kqoncuduyigktlvgnlse.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ROIDESROI10}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================================
# HIBERNATE SPATIAL - CONFIGURATION
# ================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ================================================================
# CONFIGURATION SERVEUR
# ================================================================
server.port=${PORT:8082}

# ================================================================
# CONFIGURATION LOGGING
# ================================================================
logging.level.root=INFO
logging.level.com.medilink.patient=DEBUG
logging.level.org.hibernate.SQL=DEBUG